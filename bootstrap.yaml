AWSTemplateFormatVersion: '2010-09-09'
Description: photo-uploader bootstrap - what must exist before Git sync or CI can run

# Created by hand once: this stack makes the roles Git sync assumes.
# deployments/bootstrap.yaml drives it from the repository after that.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Naming }
        Parameters: [ProjectName]
      - Label: { default: Source control }
        Parameters: [GitHubOrg, GitHubInfraRepo, GitHubBranch]

Parameters:
  ProjectName:
    Type: String
    Default: photo-app
    AllowedPattern: '^[a-z][a-z0-9-]{2,20}$'

  GitHubOrg:
    Type: String
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$'
    ConstraintDescription: >-
      Must match the owner in the repository URL exactly. The subject claim is
      compared with StringLike and no case folding.
    Description: Organisation or username that owns both repositories.

  GitHubInfraRepo:
    Type: String
    Default: photo-uploader-infra
    AllowedPattern: '^[A-Za-z0-9._-]{1,100}$'
    ConstraintDescription: A repository name on its own, not a full URL.

  GitHubBranch:
    Type: String
    Default: main
    AllowedPattern: '^[A-Za-z0-9._/-]{1,255}$'
    ConstraintDescription: A branch name, with no refs/heads/ prefix.
    Description: >-
      The only branch permitted to assume either Actions role. Must match
      on.push.branches in both workflows and the Git sync branch.

  CreateOidcProvider:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      One provider per URL per account. Leave false if the GitHub one already
      exists; check with aws iam list-open-id-connect-providers.

Conditions:
  NeedsOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:

  # --- Template staging -----------------------------------------------------

  # Nested stacks need an S3 TemplateURL, and Git sync has no packaging step.
  # CI uploads the children here under the commit SHA.
  TemplateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub '${ProjectName}-templates-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-template-sets
            Status: Enabled
            ExpirationInDays: 90
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 14

  TemplateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TemplateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt TemplateBucket.Arn
              - !Sub '${TemplateBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

  # Published so the main stack can find the bucket without the name being
  # written into the repository, where it would carry the account id.
  TemplateBucketParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/template-bucket'
      Type: String
      Value: !Ref TemplateBucket
      Description: Bucket holding the staged child templates

  # Read by main.yaml for the nested TemplateURLs and by the workflow, so the
  # templates land where the stack looks for them.
  TemplatePrefixParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/template-prefix'
      Type: String
      Value: latest
      Description: Prefix in the template bucket the child templates are synced to

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: NeedsOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubInfraRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-gha-infra'
      Description: GitHub Actions in the infrastructure repo, staging templates to S3
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - NeedsOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                # Without the aud check, any repository on GitHub could
                # present a token to this role.
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                # GitHub appends numeric ids so the claim survives a rename.
                # Both shapes accepted; the literal @ anchors the wildcard.
                'token.actions.githubusercontent.com:sub':
                  - !Sub 'repo:${GitHubOrg}/${GitHubInfraRepo}:ref:refs/heads/${GitHubBranch}'
                  - !Sub 'repo:${GitHubOrg}@*/${GitHubInfraRepo}@*:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: stage-templates
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                Resource: !Sub '${TemplateBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - 's3:ListBucket'
                  - 's3:GetBucketLocation'
                Resource: !GetAtt TemplateBucket.Arn

              # Where to sync. The script reads both rather than taking them
              # as arguments, so the bucket and prefix are defined once.
              - Effect: Allow
                Action: 'ssm:GetParameter'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/template-bucket'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/template-prefix'

  # Assumed by CloudFormation to build the stacks. Nothing else can use it.
  CfnDeploymentRole:
    Type: AWS::IAM::Role
    # Retained: CloudFormation assumes this to tear the stack down, and
    # deleting it partway strands the delete. Remove it by hand afterwards.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub '${ProjectName}-cfn-deployment'
      Description: Assumed by CloudFormation to provision the photo-uploader stacks
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
      Policies:
        - PolicyName: provision-project-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Broad within each service, but the role cannot reach anything
              # outside this list.
              - Sid: ProjectServices
                Effect: Allow
                Action:
                  - 'ec2:*'
                  - 'ecs:*'
                  - 'ecr:*'
                  - 'elasticloadbalancing:*'
                  - 'rds:*'
                  - 's3:*'
                  - 'cloudfront:*'
                  - 'secretsmanager:*'
                  - 'logs:*'
                  - 'cloudwatch:*'
                  - 'application-autoscaling:*'
                  - 'codedeploy:*'
                  - 'codepipeline:*'
                  - 'codeconnections:*'
                  - 'codestar-connections:*'
                  - 'events:*'
                  - 'sns:*'
                  - 'cloudformation:*'
                  - 'ssm:GetParameter'
                  - 'ssm:GetParameters'
                  - 'ssm:DescribeParameters'
                Resource: '*'

              # AWS managed keys only. ViaService stops the role reaching a key alone.
              - Sid: EncryptionThroughTheseServicesOnly
                Effect: Allow
                Action:
                  - 'kms:Decrypt'
                  - 'kms:DescribeKey'
                  - 'kms:GenerateDataKey'
                  - 'kms:CreateGrant'
                Resource: '*'
                Condition:
                  StringEquals:
                    'kms:ViaService':
                      - !Sub 'rds.${AWS::Region}.amazonaws.com'
                      - !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
                      - !Sub 's3.${AWS::Region}.amazonaws.com'

              # IAM is scoped by name prefix. Even with ec2:*, a role that
              # cannot mint arbitrary roles cannot escalate its own privileges.
              - Sid: ManageProjectRolesOnly
                Effect: Allow
                Action:
                  - 'iam:CreateRole'
                  - 'iam:DeleteRole'
                  - 'iam:GetRole'
                  - 'iam:TagRole'
                  - 'iam:UntagRole'
                  - 'iam:ListRoleTags'
                  - 'iam:AttachRolePolicy'
                  - 'iam:DetachRolePolicy'
                  - 'iam:PutRolePolicy'
                  - 'iam:DeleteRolePolicy'
                  - 'iam:GetRolePolicy'
                  - 'iam:ListRolePolicies'
                  - 'iam:ListAttachedRolePolicies'
                  - 'iam:UpdateAssumeRolePolicy'
                  - 'iam:PassRole'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*'

              - Sid: ReadOnlyIam
                Effect: Allow
                Action:
                  - 'iam:ListRoles'
                  - 'iam:ListPolicies'
                  - 'iam:GetPolicy'
                  - 'iam:GetPolicyVersion'
                Resource: '*'

              - Sid: CreateServiceLinkedRoles
                Effect: Allow
                Action: 'iam:CreateServiceLinkedRole'
                Resource: '*'
                Condition:
                  StringEquals:
                    'iam:AWSServiceName':
                      - ecs.amazonaws.com
                      - rds.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - ecs.application-autoscaling.amazonaws.com

        # Global services are exempt because their calls carry no regional
        # context; everything else is confined to the deployment region.
        - PolicyName: region-lock
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Deny
                NotAction:
                  - 'iam:*'
                  - 'cloudfront:*'
                  - 'sts:*'
                  - 's3:GetBucketLocation'
                  - 'route53:*'
                  - 'support:*'
                Resource: '*'
                Condition:
                  StringNotEquals:
                    'aws:RequestedRegion': !Ref AWS::Region

  # Assumed by Git sync to read the repository and drive CloudFormation.
  GitSyncRole:
    Type: AWS::IAM::Role
    # Retained for the same reason as CfnDeploymentRole above.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub '${ProjectName}-gitsync'
      Description: Assumed by CloudFormation Git sync to deploy from the repository
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.sync.codeconnections.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId
      Policies:
        - PolicyName: gitsync-operations
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadTheRepository
                Effect: Allow
                Action:
                  - 'codeconnections:UseConnection'
                  - 'codestar-connections:UseConnection'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:codeconnections:${AWS::Region}:${AWS::AccountId}:connection/*'
                  - !Sub 'arn:${AWS::Partition}:codestar-connections:${AWS::Region}:${AWS::AccountId}:connection/*'
              - Sid: DriveCloudFormation
                Effect: Allow
                Action:
                  - 'cloudformation:CreateChangeSet'
                  - 'cloudformation:DeleteChangeSet'
                  - 'cloudformation:DescribeChangeSet'
                  - 'cloudformation:ExecuteChangeSet'
                  - 'cloudformation:ListChangeSets'
                  - 'cloudformation:CreateStack'
                  - 'cloudformation:UpdateStack'
                  - 'cloudformation:DescribeStacks'
                  - 'cloudformation:DescribeStackEvents'
                  - 'cloudformation:DescribeStackResource'
                  - 'cloudformation:DescribeStackResources'
                  - 'cloudformation:GetTemplate'
                  - 'cloudformation:GetTemplateSummary'
                  - 'cloudformation:ValidateTemplate'
                  - 'cloudformation:TagResource'
                  - 'cloudformation:UntagResource'
                Resource: '*'
              - Sid: ReadStagedTemplates
                Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:GetObjectVersion'
                  - 's3:ListBucket'
                Resource:
                  - !GetAtt TemplateBucket.Arn
                  - !Sub '${TemplateBucket.Arn}/*'
              # Git sync creates its own watch rule; the name is generated by the
              # service, so it cannot be scoped by name.
              - Sid: ManageTheSyncEventRule
                Effect: Allow
                Action:
                  - 'events:PutRule'
                  - 'events:PutTargets'
                  - 'events:DescribeRule'
                  - 'events:ListTargetsByRule'
                  - 'events:DeleteRule'
                  - 'events:RemoveTargets'
                  - 'events:EnableRule'
                  - 'events:DisableRule'
                  - 'events:TagResource'
                  - 'events:UntagResource'
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*'

              - Sid: HandOffToTheDeploymentRole
                Effect: Allow
                Action: 'iam:PassRole'
                Resource: !GetAtt CfnDeploymentRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService': cloudformation.amazonaws.com

Outputs:
  TemplateBucketName:
    Description: Published to Parameter Store as well; CI reads it from there
    Value: !Ref TemplateBucket
    Export:
      Name: !Sub '${ProjectName}-TemplateBucketName'

  GitHubInfraRoleArn:
    Description: Set as secret AWS_ROLE_ARN in the infrastructure repository
    Value: !GetAtt GitHubInfraRole.Arn

  CfnDeploymentRoleArn:
    Description: Choose as the stack operations role when creating a synced stack
    Value: !GetAtt CfnDeploymentRole.Arn

  GitSyncRoleArn:
    Description: Choose as the Git sync role when creating a synced stack
    Value: !GetAtt GitSyncRole.Arn
