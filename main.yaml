AWSTemplateFormatVersion: '2010-09-09'
Description: photo-uploader main stack - composes the twelve templates in templates/

# The last four children are conditional: nothing runs before CI pushes an image.

Metadata:
  # Referenced by path; make package rewrites these into bucket URLs.
  cfn-lint:
    config:
      ignore_checks:
        - W3002

  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - ProjectName
      - Label:
          default: Addressing
        Parameters:
          - VpcCidr
          - PublicTierCidr
          - AppTierCidr
          - DataTierCidr
          - S3PrefixListId
      - Label:
          default: Database
        Parameters:
          - DbName
          - DbInstanceClass
          - DbEngineVersion
          - DbMultiAZ
      - Label:
          default: Application
        Parameters:
          - TriggerImageTag
          - ContainerPort
          - TaskCpu
          - TaskMemory
          - MinCapacity
          - MaxCapacity
          - CpuTargetPercent
      - Label:
          default: Source control
        Parameters:
          - ConnectionArn
          - GitHubOrg
          - GitHubAppRepo
          - GitHubBranch

Parameters:

  ProjectName:
    Type: String
    Default: photo-app

  VpcCidr:
    Type: String
    Default: 10.20.0.0/20
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: An IPv4 CIDR block, for example 10.20.0.0/20.

  PublicTierCidr:
    Type: String
    Default: 10.20.0.0/22
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: An IPv4 CIDR block, for example 10.20.0.0/20.

  AppTierCidr:
    Type: String
    Default: 10.20.4.0/22
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: An IPv4 CIDR block, for example 10.20.0.0/20.

  DataTierCidr:
    Type: String
    Default: 10.20.8.0/22
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: An IPv4 CIDR block, for example 10.20.0.0/20.

  S3PrefixListId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /photo-app/s3-prefix-list-id

  DbName:
    Type: String
    Default: photos

  DbInstanceClass:
    Type: String
    Default: db.t3.micro

  DbEngineVersion:
    Type: String
    Default: '16'

  DbMultiAZ:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  AlertEmail:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$'
    ConstraintDescription: An email address, or blank for no subscription.
    Description: Where alarms are delivered. Blank creates the topic without one.

  # In the deployment file, not Parameter Store: changing it there is itself
  # the commit that makes Git sync deploy the second pass.
  DeployApplication:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: >-
      false on the first pass, which builds the registry. Push an image, then
      set it to true: the service cannot start without one.

  TriggerImageTag:
    Type: String
    Default: latest
    Description: Moving tag the EventBridge rule watches.

  DbPort:
    Type: Number
    Default: 5432

  ContainerPort:
    Type: Number
    Default: 8080

  TaskCpu:
    Type: String
    Default: '512'

  TaskMemory:
    Type: String
    Default: '2048'

  MinCapacity:
    Type: Number
    Default: 1

  MaxCapacity:
    Type: Number
    Default: 4

  CpuTargetPercent:
    Type: Number
    Default: 60

  ConnectionArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /photo-app/connection-arn

  GitHubOrg:
    Type: String

  GitHubAppRepo:
    Type: String
    Default: photo-uploader-app

  GitHubBranch:
    Type: String
    Default: main

Conditions:
  DeployApplication: !Equals
    - !Ref DeployApplication
    - 'true'

Resources:

  EcrStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/ecr.yaml
      TimeoutInMinutes: 15
      Parameters:
        ProjectName: !Ref ProjectName

  AlertsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/alerts.yaml
      TimeoutInMinutes: 15
      Parameters:
        ProjectName: !Ref ProjectName
        AlertEmail: !Ref AlertEmail

  VpcStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/network.yaml
      TimeoutInMinutes: 20
      Parameters:
        ProjectName: !Ref ProjectName
        VpcCidr: !Ref VpcCidr
        PublicTierCidr: !Ref PublicTierCidr
        AppTierCidr: !Ref AppTierCidr
        DataTierCidr: !Ref DataTierCidr

  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/security.yaml
      TimeoutInMinutes: 15
      Parameters:
        DbPort: !Ref DbPort
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt VpcStack.Outputs.VpcId
        S3PrefixListId: !Ref S3PrefixListId
        ContainerPort: !Ref ContainerPort

  # What replaces a NAT gateway.
  EndpointsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/endpoints.yaml
      TimeoutInMinutes: 20
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt VpcStack.Outputs.VpcId
        AppSubnetIds: !GetAtt VpcStack.Outputs.PrivateAppSubnets
        RouteTableIds: !GetAtt VpcStack.Outputs.PrivateRouteTables
        EndpointSecurityGroupId: !GetAtt SecurityStack.Outputs.VpcEndpointSecurityGroupId

  S3CloudFrontStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/media.yaml
      TimeoutInMinutes: 30
      Parameters:
        ProjectName: !Ref ProjectName

  RdsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/database.yaml
      # Multi-AZ PostgreSQL is the slow one; everything else finishes inside this.
      TimeoutInMinutes: 45
      Parameters:
        ProjectName: !Ref ProjectName
        DataSubnetIds: !GetAtt VpcStack.Outputs.PrivateDataSubnets
        RdsSecurityGroupId: !GetAtt SecurityStack.Outputs.RdsSecurityGroupId
        DbName: !Ref DbName
        DbInstanceClass: !Ref DbInstanceClass
        DbEngineVersion: !Ref DbEngineVersion
        DbMultiAZ: !Ref DbMultiAZ

  # Roles are created before what they grant access to, so the name is passed.
  IamStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/iam.yaml
      TimeoutInMinutes: 15
      Parameters:
        ProjectName: !Ref ProjectName
        EcrRepositoryArn: !GetAtt EcrStack.Outputs.RepositoryArn
        GitHubOrg: !Ref GitHubOrg
        GitHubAppRepo: !Ref GitHubAppRepo
        GitHubBranch: !Ref GitHubBranch
        ArtifactBucketName: !Sub '${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}'
        PipelineName: !Sub '${ProjectName}-pipeline'
        MediaBucketArn: !GetAtt S3CloudFrontStack.Outputs.MediaBucketArn
        DbSecretArn: !GetAtt RdsStack.Outputs.DbSecretArn
        ConnectionArn: !Ref ConnectionArn

  EcsStack:
    Condition: DeployApplication
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/service.yaml
      TimeoutInMinutes: 30
      Parameters:
        ProjectName: !Ref ProjectName
        AppSubnetIds: !GetAtt VpcStack.Outputs.PrivateAppSubnets
        EcsSecurityGroupId: !GetAtt SecurityStack.Outputs.EcsSecurityGroupId
        MediaBucketName: !GetAtt S3CloudFrontStack.Outputs.MediaBucketName
        CloudFrontDomain: !GetAtt S3CloudFrontStack.Outputs.CloudFrontDomain
        DbSecretArn: !GetAtt RdsStack.Outputs.DbSecretArn
        TaskExecutionRoleArn: !GetAtt IamStack.Outputs.TaskExecutionRoleArn
        TaskRoleArn: !GetAtt IamStack.Outputs.TaskRoleArn
        VpcId: !GetAtt VpcStack.Outputs.VpcId
        PublicSubnetIds: !GetAtt VpcStack.Outputs.PublicSubnets
        AlbSecurityGroupId: !GetAtt SecurityStack.Outputs.AlbSecurityGroupId
        # Must not move: ECS refuses to retask a CODE_DEPLOY service.
        ImageUri: !Sub
          - '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Repo}:${Tag}'
          - Repo: !GetAtt EcrStack.Outputs.RepositoryName
            Tag: !Ref TriggerImageTag
        ContainerPort: !Ref ContainerPort
        TaskCpu: !Ref TaskCpu
        TaskMemory: !Ref TaskMemory
        MinCapacity: !Ref MinCapacity
        MaxCapacity: !Ref MaxCapacity
        CpuTargetPercent: !Ref CpuTargetPercent

  CodeDeployStack:
    Condition: DeployApplication
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/codedeploy.yaml
      TimeoutInMinutes: 15
      Parameters:
        ProjectName: !Ref ProjectName
        AlertTopicArn: !GetAtt AlertsStack.Outputs.TopicArn
        CodeDeployRoleArn: !GetAtt IamStack.Outputs.CodeDeployRoleArn
        ClusterName: !GetAtt EcsStack.Outputs.ClusterName
        ServiceName: !GetAtt EcsStack.Outputs.ServiceName
        TargetGroupBlueName: !GetAtt EcsStack.Outputs.TargetGroupBlueName
        TargetGroupGreenName: !GetAtt EcsStack.Outputs.TargetGroupGreenName
        ListenerArn: !GetAtt EcsStack.Outputs.ListenerArn
        LoadBalancerFullName: !GetAtt EcsStack.Outputs.LoadBalancerFullName

  CodePipelineStack:
    Condition: DeployApplication
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/pipeline.yaml
      TimeoutInMinutes: 20
      Parameters:
        ProjectName: !Ref ProjectName
        ArtifactBucketName: !Sub '${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}'
        PipelineName: !Sub '${ProjectName}-pipeline'
        AlertTopicArn: !GetAtt AlertsStack.Outputs.TopicArn
        ConnectionArn: !Ref ConnectionArn
        GitHubOrg: !Ref GitHubOrg
        GitHubAppRepo: !Ref GitHubAppRepo
        GitHubBranch: !Ref GitHubBranch
        PipelineRoleArn: !GetAtt IamStack.Outputs.PipelineRoleArn
        EventBridgeRoleArn: !GetAtt IamStack.Outputs.EventBridgeRoleArn
        EcrRepositoryName: !GetAtt EcrStack.Outputs.RepositoryName
        TriggerImageTag: !Ref TriggerImageTag
        CodeDeployApplicationName: !GetAtt CodeDeployStack.Outputs.ApplicationName
        CodeDeployDeploymentGroupName: !GetAtt CodeDeployStack.Outputs.DeploymentGroupName

  CloudWatchStack:
    Condition: DeployApplication
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/monitoring.yaml
      TimeoutInMinutes: 15
      Parameters:
        ProjectName: !Ref ProjectName
        AlertTopicArn: !GetAtt AlertsStack.Outputs.TopicArn
        DbInstanceIdentifier: !GetAtt RdsStack.Outputs.DbInstanceIdentifier
        LoadBalancerFullName: !GetAtt EcsStack.Outputs.LoadBalancerFullName
        TargetGroupBlueFullName: !GetAtt EcsStack.Outputs.TargetGroupBlueFullName
        ClusterName: !GetAtt EcsStack.Outputs.ClusterName
        ServiceName: !GetAtt EcsStack.Outputs.ServiceName
        MaxCapacity: !Ref MaxCapacity

Outputs:

  # The app repo's AWS_ROLE_ARN. Needed on the first pass, so not conditional.
  GitHubAppRoleArn:
    Description: Role GitHub Actions in the app repository assumes
    Value: !GetAtt IamStack.Outputs.GitHubAppRoleArn

  ApplicationUrl:
    Condition: DeployApplication
    Description: Public application endpoint
    Value: !Sub
      - 'http://${Dns}'
      - Dns: !GetAtt EcsStack.Outputs.DnsName

  CloudFrontDomain:
    Value: !GetAtt S3CloudFrontStack.Outputs.CloudFrontDomain

  ClusterName:
    Condition: DeployApplication
    Value: !GetAtt EcsStack.Outputs.ClusterName

  ServiceName:
    Condition: DeployApplication
    Value: !GetAtt EcsStack.Outputs.ServiceName

  PipelineName:
    Condition: DeployApplication
    Value: !GetAtt CodePipelineStack.Outputs.PipelineName
