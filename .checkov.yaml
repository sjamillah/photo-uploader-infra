# Every entry below is a position held on purpose, with the reason beside it.
# The other 138 checks still run, which is why this scan stays in CI.

directory:
  - .
framework:
  - cloudformation
compact: true
quiet: true

skip-check:
  # MultiAZ is !Ref DbMultiAZ and main.yaml defaults it to true. checkov cannot
  # follow a parameter across a nested stack boundary.
  - CKV_AWS_157

  # No custom domain, so there is no certificate to attach. TLS terminates at
  # CloudFront, and the ALB is the public entry point on port 80.
  - CKV_AWS_2
  - CKV_AWS_103
  - CKV_AWS_174
  - CKV_AWS_260

  # AES256 with AWS managed keys. A customer managed key per service is a
  # monthly charge, and nothing here requires its own rotation schedule.
  - CKV_AWS_136
  - CKV_AWS_149
  - CKV_AWS_158

  # Access logging. Nothing reads these logs, and each one is another bucket to
  # pay for and expire.
  - CKV_AWS_18
  - CKV_AWS_86
  - CKV_AWS_91

  # Versioning on the artifact bucket, whose objects expire after 30 days.
  - CKV_AWS_21

  # Paid add-ons the brief does not ask for.
  - CKV_AWS_68
  - CKV_AWS_118

  # Tags must stay mutable: moving :latest is what fires the EventBridge rule
  # that starts the pipeline.
  - CKV_AWS_51

  # The application authenticates with credentials from Secrets Manager, which
  # the task definition injects at start.
  - CKV_AWS_161

  # The deployment role holds service-level wildcards on purpose, fenced by a
  # region lock and an IAM name prefix. bootstrap.yaml argues it at the policy.
  - CKV_AWS_107
  - CKV_AWS_108
  - CKV_AWS_109
  - CKV_AWS_111
