AWSTemplateFormatVersion: '2010-09-09'
Description: photo-uploader main stack - composes the twelve templates in 
  templates/
Metadata:
  cfn-lint:
    config:
      ignore_checks:
      - W3002
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: Naming
      Parameters:
      - ProjectName
    - Label:
        default: Addressing
      Parameters:
      - VpcCidr
      - PublicTierCidr
      - AppTierCidr
      - DataTierCidr
      - S3PrefixListId
    - Label:
        default: Database
      Parameters:
      - DbName
      - DbInstanceClass
      - DbEngineVersion
      - DbMultiAZ
    - Label:
        default: Application
      Parameters:
      - TriggerImageTag
      - ContainerPort
      - TaskCpu
      - TaskMemory
      - MinCapacity
      - MaxCapacity
      - CpuTargetPercent
    - Label:
        default: Source control
      Parameters:
      - ConnectionArn
      - GitHubOrg
      - GitHubAppRepo
      - GitHubBranch
Parameters:
  ProjectName:
    Type: String
    Default: photo-app
  VpcCidr:
    Type: String
    Default: 10.20.0.0/20
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: An IPv4 CIDR block, for example 10.20.0.0/20.
  PublicTierCidr:
    Type: String
    Default: 10.20.0.0/22
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: An IPv4 CIDR block, for example 10.20.0.0/20.
  AppTierCidr:
    Type: String
    Default: 10.20.4.0/22
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: An IPv4 CIDR block, for example 10.20.0.0/20.
  DataTierCidr:
    Type: String
    Default: 10.20.8.0/22
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: An IPv4 CIDR block, for example 10.20.0.0/20.
  S3PrefixListId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /photo-app/s3-prefix-list-id
  DbName:
    Type: String
    Default: photos
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
  DbEngineVersion:
    Type: String
    Default: '16'
  DbMultiAZ:
    Type: String
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'
  AlertEmail:
    Type: String
    Default: ''
    AllowedPattern: ^$|^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$
    ConstraintDescription: An email address, or blank for no subscription.
    Description: Where alarms are delivered. Blank creates the topic without 
      one.
  DeployApplication:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'true'
    - 'false'
    Description: 'false on the first pass, which builds the registry. Push an image,
      then set it to true: the service cannot start without one.'
  TriggerImageTag:
    Type: String
    Default: latest
    Description: Moving tag the EventBridge rule watches.
  DbPort:
    Type: Number
    Default: 5432
  ContainerPort:
    Type: Number
    Default: 8080
  TaskCpu:
    Type: String
    Default: '512'
  TaskMemory:
    Type: String
    Default: '2048'
  MinCapacity:
    Type: Number
    Default: 1
  MaxCapacity:
    Type: Number
    Default: 4
  CpuTargetPercent:
    Type: Number
    Default: 60
  ConnectionArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /photo-app/connection-arn
  GitHubOrg:
    Type: String
  GitHubAppRepo:
    Type: String
    Default: photo-uploader-app
  GitHubBranch:
    Type: String
    Default: main
Conditions:
  DeployApplication:
    Fn::Equals:
    - Ref: DeployApplication
    - 'true'
Resources:
  EcrStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/photo-app-templates-697863031884-eu-north-1/latest/b165f35e8c07311fabe27d205b153824.template
      TimeoutInMinutes: 15
      Parameters:
        ProjectName:
          Ref: ProjectName
  AlertsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/photo-app-templates-697863031884-eu-north-1/latest/55fd162cf3f44b79af0514d3691d07b8.template
      TimeoutInMinutes: 15
      Parameters:
        ProjectName:
          Ref: ProjectName
        AlertEmail:
          Ref: AlertEmail
  VpcStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/photo-app-templates-697863031884-eu-north-1/latest/3aa28b14935b546e1b1140c007168da6.template
      TimeoutInMinutes: 20
      Parameters:
        ProjectName:
          Ref: ProjectName
        VpcCidr:
          Ref: VpcCidr
        PublicTierCidr:
          Ref: PublicTierCidr
        AppTierCidr:
          Ref: AppTierCidr
        DataTierCidr:
          Ref: DataTierCidr
  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/photo-app-templates-697863031884-eu-north-1/latest/0845571449950106f4e71f91200d6740.template
      TimeoutInMinutes: 15
      Parameters:
        DbPort:
          Ref: DbPort
        ProjectName:
          Ref: ProjectName
        VpcId:
          Fn::GetAtt:
          - VpcStack
          - Outputs.VpcId
        S3PrefixListId:
          Ref: S3PrefixListId
        ContainerPort:
          Ref: ContainerPort
  EndpointsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/photo-app-templates-697863031884-eu-north-1/latest/7970255951589aaa702af672cf55cbef.template
      TimeoutInMinutes: 20
      Parameters:
        ProjectName:
          Ref: ProjectName
        VpcId:
          Fn::GetAtt:
          - VpcStack
          - Outputs.VpcId
        AppSubnetIds:
          Fn::GetAtt:
          - VpcStack
          - Outputs.PrivateAppSubnets
        RouteTableIds:
          Fn::GetAtt:
          - VpcStack
          - Outputs.PrivateRouteTables
        EndpointSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.VpcEndpointSecurityGroupId
  S3CloudFrontStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/photo-app-templates-697863031884-eu-north-1/latest/9bf99650494747863af8456d508a3d67.template
      TimeoutInMinutes: 30
      Parameters:
        ProjectName:
          Ref: ProjectName
  RdsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/photo-app-templates-697863031884-eu-north-1/latest/25c778f6aa3720f55b09c9e1067ba9d6.template
      TimeoutInMinutes: 45
      Parameters:
        ProjectName:
          Ref: ProjectName
        DataSubnetIds:
          Fn::GetAtt:
          - VpcStack
          - Outputs.PrivateDataSubnets
        RdsSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.RdsSecurityGroupId
        DbName:
          Ref: DbName
        DbInstanceClass:
          Ref: DbInstanceClass
        DbEngineVersion:
          Ref: DbEngineVersion
        DbMultiAZ:
          Ref: DbMultiAZ
  IamStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/photo-app-templates-697863031884-eu-north-1/latest/7580c5c391f22997c168ed635d2f9d87.template
      TimeoutInMinutes: 15
      Parameters:
        ProjectName:
          Ref: ProjectName
        EcrRepositoryArn:
          Fn::GetAtt:
          - EcrStack
          - Outputs.RepositoryArn
        GitHubOrg:
          Ref: GitHubOrg
        GitHubAppRepo:
          Ref: GitHubAppRepo
        GitHubBranch:
          Ref: GitHubBranch
        ArtifactBucketName:
          Fn::Sub: ${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}
        PipelineName:
          Fn::Sub: ${ProjectName}-pipeline
        MediaBucketArn:
          Fn::GetAtt:
          - S3CloudFrontStack
          - Outputs.MediaBucketArn
        DbSecretArn:
          Fn::GetAtt:
          - RdsStack
          - Outputs.DbSecretArn
        ConnectionArn:
          Ref: ConnectionArn
  EcsStack:
    Condition: DeployApplication
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/photo-app-templates-697863031884-eu-north-1/latest/75f520c02055e7ccb8981ea06e0a2d1f.template
      TimeoutInMinutes: 30
      Parameters:
        ProjectName:
          Ref: ProjectName
        AppSubnetIds:
          Fn::GetAtt:
          - VpcStack
          - Outputs.PrivateAppSubnets
        EcsSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.EcsSecurityGroupId
        MediaBucketName:
          Fn::GetAtt:
          - S3CloudFrontStack
          - Outputs.MediaBucketName
        CloudFrontDomain:
          Fn::GetAtt:
          - S3CloudFrontStack
          - Outputs.CloudFrontDomain
        DbSecretArn:
          Fn::GetAtt:
          - RdsStack
          - Outputs.DbSecretArn
        TaskExecutionRoleArn:
          Fn::GetAtt:
          - IamStack
          - Outputs.TaskExecutionRoleArn
        TaskRoleArn:
          Fn::GetAtt:
          - IamStack
          - Outputs.TaskRoleArn
        VpcId:
          Fn::GetAtt:
          - VpcStack
          - Outputs.VpcId
        PublicSubnetIds:
          Fn::GetAtt:
          - VpcStack
          - Outputs.PublicSubnets
        AlbSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.AlbSecurityGroupId
        ImageUri:
          Fn::Sub:
          - ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Repo}:${Tag}
          - Repo:
              Fn::GetAtt:
              - EcrStack
              - Outputs.RepositoryName
            Tag:
              Ref: TriggerImageTag
        ContainerPort:
          Ref: ContainerPort
        TaskCpu:
          Ref: TaskCpu
        TaskMemory:
          Ref: TaskMemory
        MinCapacity:
          Ref: MinCapacity
        MaxCapacity:
          Ref: MaxCapacity
        CpuTargetPercent:
          Ref: CpuTargetPercent
  CodeDeployStack:
    Condition: DeployApplication
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/photo-app-templates-697863031884-eu-north-1/latest/5e1e78eb72221417c0b7b604e2a64de6.template
      TimeoutInMinutes: 15
      Parameters:
        ProjectName:
          Ref: ProjectName
        AlertTopicArn:
          Fn::GetAtt:
          - AlertsStack
          - Outputs.TopicArn
        CodeDeployRoleArn:
          Fn::GetAtt:
          - IamStack
          - Outputs.CodeDeployRoleArn
        ClusterName:
          Fn::GetAtt:
          - EcsStack
          - Outputs.ClusterName
        ServiceName:
          Fn::GetAtt:
          - EcsStack
          - Outputs.ServiceName
        TargetGroupBlueName:
          Fn::GetAtt:
          - EcsStack
          - Outputs.TargetGroupBlueName
        TargetGroupGreenName:
          Fn::GetAtt:
          - EcsStack
          - Outputs.TargetGroupGreenName
        ListenerArn:
          Fn::GetAtt:
          - EcsStack
          - Outputs.ListenerArn
        LoadBalancerFullName:
          Fn::GetAtt:
          - EcsStack
          - Outputs.LoadBalancerFullName
  CodePipelineStack:
    Condition: DeployApplication
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/photo-app-templates-697863031884-eu-north-1/latest/dc4e66e51a2b917e27192acdf403d142.template
      TimeoutInMinutes: 20
      Parameters:
        ProjectName:
          Ref: ProjectName
        ArtifactBucketName:
          Fn::Sub: ${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}
        PipelineName:
          Fn::Sub: ${ProjectName}-pipeline
        AlertTopicArn:
          Fn::GetAtt:
          - AlertsStack
          - Outputs.TopicArn
        ConnectionArn:
          Ref: ConnectionArn
        GitHubOrg:
          Ref: GitHubOrg
        GitHubAppRepo:
          Ref: GitHubAppRepo
        GitHubBranch:
          Ref: GitHubBranch
        PipelineRoleArn:
          Fn::GetAtt:
          - IamStack
          - Outputs.PipelineRoleArn
        EventBridgeRoleArn:
          Fn::GetAtt:
          - IamStack
          - Outputs.EventBridgeRoleArn
        EcrRepositoryName:
          Fn::GetAtt:
          - EcrStack
          - Outputs.RepositoryName
        TriggerImageTag:
          Ref: TriggerImageTag
        CodeDeployApplicationName:
          Fn::GetAtt:
          - CodeDeployStack
          - Outputs.ApplicationName
        CodeDeployDeploymentGroupName:
          Fn::GetAtt:
          - CodeDeployStack
          - Outputs.DeploymentGroupName
  CloudWatchStack:
    Condition: DeployApplication
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/photo-app-templates-697863031884-eu-north-1/latest/4c3dbd886c0f4e038a58bbcde94a489c.template
      TimeoutInMinutes: 15
      Parameters:
        ProjectName:
          Ref: ProjectName
        AlertTopicArn:
          Fn::GetAtt:
          - AlertsStack
          - Outputs.TopicArn
        DbInstanceIdentifier:
          Fn::GetAtt:
          - RdsStack
          - Outputs.DbInstanceIdentifier
        LoadBalancerFullName:
          Fn::GetAtt:
          - EcsStack
          - Outputs.LoadBalancerFullName
        TargetGroupBlueFullName:
          Fn::GetAtt:
          - EcsStack
          - Outputs.TargetGroupBlueFullName
        ClusterName:
          Fn::GetAtt:
          - EcsStack
          - Outputs.ClusterName
        ServiceName:
          Fn::GetAtt:
          - EcsStack
          - Outputs.ServiceName
        MaxCapacity:
          Ref: MaxCapacity
Outputs:
  GitHubAppRoleArn:
    Description: Role GitHub Actions in the app repository assumes
    Value:
      Fn::GetAtt:
      - IamStack
      - Outputs.GitHubAppRoleArn
  ApplicationUrl:
    Condition: DeployApplication
    Description: Public application endpoint
    Value:
      Fn::Sub:
      - http://${Dns}
      - Dns:
          Fn::GetAtt:
          - EcsStack
          - Outputs.DnsName
  CloudFrontDomain:
    Value:
      Fn::GetAtt:
      - S3CloudFrontStack
      - Outputs.CloudFrontDomain
  ClusterName:
    Condition: DeployApplication
    Value:
      Fn::GetAtt:
      - EcsStack
      - Outputs.ClusterName
  ServiceName:
    Condition: DeployApplication
    Value:
      Fn::GetAtt:
      - EcsStack
      - Outputs.ServiceName
  PipelineName:
    Condition: DeployApplication
    Value:
      Fn::GetAtt:
      - CodePipelineStack
      - Outputs.PipelineName
