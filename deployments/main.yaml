# Git sync has no packaging step, so it deploys the packaged file that
# `make package` writes from main.yaml.
template-file-path: main.packaged.yaml

# Only what main.yaml cannot work out for itself. Anything account-specific
# is read from Parameter Store by the template, so it never lands in git.
parameters:
  ProjectName: photo-app


  # Where alarms are delivered. AWS emails a confirmation link that has to be
  # clicked before anything arrives.
  AlertEmail: 'j.ssozi@alustudent.com'

  # false on the first pass: network, roles, media, database and the registry
  # only. Push an image, flip this to true, push again.
  DeployApplication: 'true'

  GitHubOrg: sjamillah

tags:
  Project: photo-uploader
  Environment: dev
  Owner: jamillah.ssozi
  ManagedBy: cloudformation-gitsync
  CostCentre: training
