# Git sync deploys the packaged file make package writes. Only the connection
# ARN and the S3 prefix list id come from Parameter Store; they have no
# CloudFormation source.
template-file-path: main.packaged.yaml

parameters:
  # Only true once an image is in ECR: the service, CodeDeploy and the
  # pipeline come up with this commit, and a task with nothing to pull cycles.
  DeployApplication: 'true'

  GitHubOrg: sjamillah

  # AWS emails a confirmation link that has to be clicked before anything
  # arrives. Changing it here replaces the subscription.
  AlertEmail: 'j.ssozi@alustudent.com'

tags:
  Project: photo-uploader
  Environment: dev
  Owner: jamillah.ssozi
  ManagedBy: cloudformation-gitsync
  CostCentre: training
