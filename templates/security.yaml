AWSTemplateFormatVersion: '2010-09-09'
Description: photo-uploader security groups - four groups and every rule between them

Parameters:
  ProjectName:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id

  ContainerPort:
    Type: Number
    MinValue: 1
    MaxValue: 65535
    Description: Passed from main.yaml, and what the target groups and container use.

  DbPort:
    Type: Number
    MinValue: 1
    MaxValue: 65535
    Description: Passed from main.yaml, and the port the database actually listens on.

  S3PrefixListId:
    Type: String
    Description: >-
      Assigned by AWS per region and returned by no resource, so it is read from
      Parameter Store by main.yaml and handed down.

Resources:

  # Egress is inline, because omitting it leaves the default allow-all outbound
  # in place; only ingress is separate, which is what breaks the cycle.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public ALB, accepts HTTP from the internet
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Public HTTP
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          DestinationSecurityGroupId: !Ref EcsSecurityGroup
          Description: Traffic to the containers
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-alb-sg'

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fargate tasks, ALB inbound and AWS-service outbound only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationSecurityGroupId: !Ref VpcEndpointSecurityGroup
          Description: ECR, CloudWatch Logs, Secrets Manager, SSM Messages
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationPrefixListId: !Ref S3PrefixListId
          Description: S3 gateway endpoint, image layers and photo objects
        - IpProtocol: tcp
          FromPort: !Ref DbPort
          ToPort: !Ref DbPort
          DestinationSecurityGroupId: !Ref RdsSecurityGroup
          Description: PostgreSQL
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-ecs-sg'

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL, reachable only from the tasks
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
          Description: No egress required
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-rds-sg'

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Interface endpoint ENIs, HTTPS from the tasks
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
          Description: No egress required, responses are stateful
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpce-sg'

  # --- Ingress --------------------------------------------------------------

  # Separate resources: a group cannot name in its own ingress a group that
  # names it back, which is the circular dependency the AWS examples warn about.

  EcsFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: Gunicorn

  RdsFromEcsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref DbPort
      ToPort: !Ref DbPort
      SourceSecurityGroupId: !Ref EcsSecurityGroup
      Description: PostgreSQL from the application tasks

  EndpointsFromEcsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref VpcEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref EcsSecurityGroup
      Description: HTTPS to the endpoint ENIs

Outputs:
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup

  EcsSecurityGroupId:
    Value: !Ref EcsSecurityGroup

  RdsSecurityGroupId:
    Value: !Ref RdsSecurityGroup

  VpcEndpointSecurityGroupId:
    Value: !Ref VpcEndpointSecurityGroup
