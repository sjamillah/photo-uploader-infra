AWSTemplateFormatVersion: '2010-09-09'
Description: photo-uploader blue/green - the CodeDeploy application and what gates a cutover

Parameters:
  ProjectName:
    Type: String
  AlertTopicArn:
    Type: String
  CodeDeployRoleArn:
    Type: String

  # From service.yaml. CodeDeploy addresses all of these by name, not by ARN.
  ClusterName:
    Type: String
  ServiceName:
    Type: String
  TargetGroupBlueName:
    Type: String
  TargetGroupGreenName:
    Type: String
  ListenerArn:
    Type: String
  LoadBalancerFullName:
    Type: String

  # Below this many requests in a minute a p95 is not a p95, it is the slowest
  # request wearing a percentile's name. See HighLatencyAlarm.
  MinRequestsForLatency:
    Type: Number
    Default: 30

Resources:

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub '${ProjectName}-app'
      ComputePlatform: ECS

  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub '${ProjectName}-dg'
      ServiceRoleArn: !Ref CodeDeployRoleArn
      # ECSCanary10Percent5Minutes shifts traffic gradually instead.
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          # Old tasks outlive the cutover, so a rollback needs no cold start.
          # This is also the only window in which the gating alarms below see
          # the new task set serving production traffic: at 0 the deployment
          # finished in about a minute, which is less than the delay on an ALB
          # latency datapoint, so the gate only ever judged the old version.
          TerminationWaitTimeInMinutes: 5
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
          - DEPLOYMENT_STOP_ON_ALARM
      # Without alarms attached, DEPLOYMENT_STOP_ON_ALARM above can never fire.
      AlarmConfiguration:
        Enabled: true
        # If CloudWatch cannot be polled, fail the deployment. Do not deploy blind.
        IgnorePollAlarmFailure: false
        Alarms:
          - Name: !Ref Target5xxAlarm
          - Name: !Ref HighLatencyAlarm
      ECSServices:
        - ClusterName: !Ref ClusterName
          ServiceName: !Ref ServiceName
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !Ref TargetGroupBlueName
              - Name: !Ref TargetGroupGreenName
            # TestTrafficRoute is optional; nothing sends validation traffic.
            ProdTrafficRoute:
              ListenerArns:
                - !Ref ListenerArn

  # --- Alarms that gate the cutover -----------------------------------------

  # Keep these fast: a fifteen-minute alarm cannot gate a five-minute deployment.
  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-target-5xx'
      AlarmDescription: Application returned 5xx responses
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # No traffic must not read as failure, or a quiet night pages someone.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn
      OKActions:
        - !Ref AlertTopicArn

  # This alarm stopped deployment d-7EU8KC3QJ on 2026-09-18 and it was wrong to.
  #
  # The ALB carries single digit requests a minute. At that volume a p95 is just
  # the slowest request, and the slowest request on this site is always the same
  # thing: POST /api/photos, which decodes the upload, resizes it twice through
  # LANCZOS, encodes two WebPs and does two S3 puts, all inside the request. One
  # such upload at 08:50:05 put the 08:50 datapoint at 7.83s over four samples.
  # ALB latency datapoints also arrive late, so CloudWatch was still evaluating
  # that 08:50 datapoint at 08:53:40 - by which time the deployment had started,
  # and it was rolled back over a number the old version produced before it began.
  #
  # Two changes. The expression holds the gate shut below MinRequestsForLatency
  # requests a minute, so a p95 only counts once enough requests went into it,
  # and it now takes two breaching minutes out of three, which no single slow
  # upload can produce.
  HighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-high-latency'
      AlarmDescription: >-
        p95 response time above two seconds for two of three minutes, counting
        only minutes that carried enough traffic for a p95 to mean anything
      Metrics:
        - Id: latency
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: TargetResponseTime
              Dimensions:
                - Name: LoadBalancer
                  Value: !Ref LoadBalancerFullName
            Period: 60
            # p95, not Average, which hides the tail.
            Stat: p95
        - Id: requests
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: RequestCount
              Dimensions:
                - Name: LoadBalancer
                  Value: !Ref LoadBalancerFullName
            Period: 60
            Stat: Sum
        - Id: latency_when_busy
          ReturnData: true
          Label: p95 response time over minutes carrying real traffic
          Expression: !Sub 'IF(requests >= ${MinRequestsForLatency}, latency, 0)'
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopicArn

Outputs:
  ApplicationName:
    Value: !Ref CodeDeployApplication

  DeploymentGroupName:
    Value: !Ref DeploymentGroup
