AWSTemplateFormatVersion: '2010-09-09'
Description: photo-uploader IAM - every role except the ones needed before this stack exists

# Every role except the three bootstrap.yaml creates, which Git sync and CI
# both need before anything is deployed.

Parameters:
  ProjectName: { Type: String }

  # Defined once in main.yaml and handed to both stacks, because the roles
  # are created before the resources they grant access to.
  ArtifactBucketName: { Type: String }
  EcrRepositoryArn: { Type: String }
  GitHubOrg: { Type: String }
  GitHubAppRepo: { Type: String }
  GitHubBranch: { Type: String }
  PipelineName: { Type: String }
  MediaBucketArn: { Type: String }
  DbSecretArn: { Type: String }
  ConnectionArn: { Type: String }

Resources:

  # --- ECS ------------------------------------------------------------------

  # The ECS agent, before the application starts: pull the image, fetch the
  # secret, create the log stream.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-task-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'secretsmanager:GetSecretValue'
                Resource: !Ref DbSecretArn

  # The application itself. Separate from the execution role so application
  # code can never pull images or read secrets it was not injected with.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: media-bucket-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Objects under one prefix. Not the bucket, and not ListBucket.
              - Sid: ObjectsUnderPhotosPrefixOnly
                Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:GetObject'
                  - 's3:DeleteObject'
                Resource: !Sub '${MediaBucketArn}/photos/*'
        - PolicyName: ecs-exec
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Needed for `aws ecs execute-command`, which is the fastest way
              # to diagnose a task that cannot reach the database.
              - Effect: Allow
                Action:
                  - 'ssmmessages:CreateControlChannel'
                  - 'ssmmessages:CreateDataChannel'
                  - 'ssmmessages:OpenControlChannel'
                  - 'ssmmessages:OpenDataChannel'
                Resource: '*'

  # --- Deployment -----------------------------------------------------------

  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-codedeploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-pipeline'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: pipeline-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Artifacts
                Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:GetObjectVersion'
                  - 's3:PutObject'
                  - 's3:GetBucketLocation'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucketName}/*'
              - Sid: UseGitHubConnection
                Effect: Allow
                Action: 'codeconnections:UseConnection'
                Resource: !Ref ConnectionArn
              - Sid: ReadEcr
                Effect: Allow
                Action:
                  - 'ecr:DescribeImages'
                  - 'ecr:GetAuthorizationToken'
                Resource: '*'
              - Sid: DriveCodeDeploy
                Effect: Allow
                Action:
                  - 'codedeploy:CreateDeployment'
                  - 'codedeploy:GetDeployment'
                  - 'codedeploy:GetDeploymentConfig'
                  - 'codedeploy:GetApplication'
                  - 'codedeploy:GetApplicationRevision'
                  - 'codedeploy:RegisterApplicationRevision'
                Resource: '*'
              - Sid: RegisterTaskDefinitions
                Effect: Allow
                Action:
                  - 'ecs:RegisterTaskDefinition'
                  - 'ecs:DescribeTaskDefinition'
                  - 'ecs:DescribeServices'
                Resource: '*'
              - Sid: PassTaskRoles
                Effect: Allow
                Action: 'iam:PassRole'
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn
                Condition:
                  StringEquals:
                    # These roles can go to ECS and nowhere else.
                    'iam:PassedToService': ecs-tasks.amazonaws.com

  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-eventbridge-pipeline'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: start-pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'codepipeline:StartPipelineExecution'
                Resource: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${PipelineName}'

  GitHubAppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-gha-app'
      Description: GitHub Actions in the application repo, pushing images to ECR
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                # GitHub appends numeric ids so the claim survives a rename.
                # Both shapes accepted; the literal @ anchors the wildcard.
                'token.actions.githubusercontent.com:sub':
                  - !Sub 'repo:${GitHubOrg}/${GitHubAppRepo}:ref:refs/heads/${GitHubBranch}'
                  - !Sub 'repo:${GitHubOrg}@*/${GitHubAppRepo}@*:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: ecr-push
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AuthTokenIsAccountWide
                Effect: Allow
                Action: 'ecr:GetAuthorizationToken'
                Resource: '*'
              - Sid: PushToThisRepositoryOnly
                Effect: Allow
                Action:
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:InitiateLayerUpload'
                  - 'ecr:UploadLayerPart'
                  - 'ecr:CompleteLayerUpload'
                  - 'ecr:PutImage'
                  - 'ecr:BatchGetImage'
                  - 'ecr:GetDownloadUrlForLayer'
                  # The workflow writes back the digest it just pushed, so Parameter Store
                  # holds an immutable reference rather than a movable tag.
                  - 'ecr:DescribeImages'
                # The repository is templates/ecr.yaml now, so its ARN is built
                # from the name rather than referenced.
                Resource: !Ref EcrRepositoryArn
              - Sid: RecordTheDeployedImage
                Effect: Allow
                Action:
                  - 'ssm:PutParameter'
                  - 'ssm:GetParameter'
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/image/*'

Outputs:
  GitHubAppRoleArn:
    Description: Set as secret AWS_ROLE_ARN in the application repository
    Value: !GetAtt GitHubAppRole.Arn

  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn

  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn

  CodeDeployRoleArn:
    Value: !GetAtt CodeDeployRole.Arn

  PipelineRoleArn:
    Value: !GetAtt PipelineRole.Arn

  EventBridgeRoleArn:
    Value: !GetAtt EventBridgeRole.Arn
