name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default; only the job that talks to AWS gets more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned, so a new release adding a check fails on the commit that
      # bumps it rather than on someone else's unrelated push.
      - run: pip install cfn-lint==1.56.1 checkov==3.3.16

      - run: cfn-lint bootstrap.yaml main.yaml templates/*.yaml

      # Scope and suppressions live in .checkov.yaml, each with its reason.
      - run: checkov --config-file .checkov.yaml

  upload:
    name: Upload templates
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The script compares against the previous commit to decide whether
          # any template actually moved.
          fetch-depth: 2

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload and point the deployment file
        run: |
          bash scripts/upload-templates.sh \
            "${{ secrets.TEMPLATE_BUCKET }}" \
            "${{ github.sha }}"
