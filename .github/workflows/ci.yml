name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing is written back to the repository: you commit main.packaged.yaml
# yourself, and this job checks that what you committed is what the templates
# produce.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and verify packaging
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The pinned version lives in the Makefile, so CI and a laptop install
      # the same one.
      - run: make tools

      # Pull requests stop here: no credentials, no S3.
      - if: github.event_name == 'pull_request'
        run: make lint

      - if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Git sync has already deployed the commit you pushed. This is the check
      # that the packaged file in it was honest, not a gate.
      - if: github.event_name != 'pull_request'
        run: make verify
