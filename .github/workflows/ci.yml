name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the job that talks to AWS gets more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned so a new release fails on the commit that bumps it, not on
      # someone else's unrelated push.
      - run: pip install cfn-lint==1.56.1

      - run: cfn-lint bootstrap.yaml main.yaml templates/*.yaml

  upload:
    name: Upload templates
    needs: check
    # Pull requests stop after the lint. Run workflow re-uploads on demand,
    # which is how you recover when the bucket is emptied or recreated.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The script compares against the previous commit to decide whether
          # any template actually moved.
          fetch-depth: 2

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload and point the deployment file
        run: |
          bash scripts/upload-templates.sh \
            "${{ secrets.TEMPLATE_BUCKET }}" \
            "${{ github.sha }}"
