name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the job that talks to AWS gets more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned so a new release fails on the commit that bumps it, not on
      # someone else's unrelated push.
      - run: pip install cfn-lint==1.56.1

      # The glob lives in the Makefile so it is not written down twice.
      - run: make lint

  package:
    name: Package
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # contents: write because the packaged template is committed back. Git sync
    # deploys that commit, not the one you pushed.
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Uploads the children and rewrites their paths into bucket URLs. Package
      # keys objects by content, so an unchanged template uploads nothing.
      - run: make package

      # Only when something moved. A push made with GITHUB_TOKEN starts no
      # workflow, so this cannot loop.
      - name: Commit the packaged template
        run: |
          if git diff --quiet -- main.packaged.yaml; then
            echo "nothing to repackage"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.packaged.yaml
          git commit -m "repackage for ${GITHUB_SHA::7}"
          git push
