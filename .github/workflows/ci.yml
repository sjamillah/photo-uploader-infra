name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the job that talks to AWS gets more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned so a new release fails on the commit that bumps it, not on
      # someone else's unrelated push.
      - run: pip install cfn-lint==1.56.1

      # The glob lives in the Makefile so it is not written down twice.
      - run: make lint

  package:
    name: Package
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Read only. Nothing is generated here and nothing is written back:
    # main.packaged.yaml is committed by whoever changed the templates.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ci-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Uploads the children and rewrites the paths in main.yaml, then proves
      # the committed main.packaged.yaml already says the same thing. Package
      # keys objects by content, so an unchanged template uploads nothing.
      - name: Package and prove it is in step
        run: make check
